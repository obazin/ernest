[package]
name = "ernest"
version = "0.1.0"
description = "Distraction-free writing app for Markdown and plain text, with a complete Vim mode."
authors = ["Olivier Bazin"]
license = "MIT"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "Ernest"

# Capitalised so macOS shows "Ernest" in the dock during `tauri dev`, where
# the binary runs without an .app wrapper. Matches `mainBinaryName`.
[[bin]]
name = "Ernest"
path = "src/main.rs"

[lib]
name = "ernest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
fontdb = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spellbook = "0.4.2"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
