[package]
name = "hemingway"
version = "0.1.0"
description = "Distraction-free writing app for Markdown and plain text, with a complete Vim mode."
authors = ["Olivier Bazin"]
edition = "2024"
publish = false
default-run = "Hemingway"

# Capitalised so macOS shows "Hemingway" in the dock during `tauri dev`, where
# the binary runs without an .app wrapper. Matches `mainBinaryName`.
[[bin]]
name = "Hemingway"
path = "src/main.rs"

[lib]
name = "hemingway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
fontdb = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
